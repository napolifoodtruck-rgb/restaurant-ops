# Render Blueprint: the web app and its database.
# In Render: New → Blueprint → pick this repository. Secrets marked `sync: false` are typed
# into the Render dashboard, never committed here.
services:
  - type: web
    name: restaurant-ops
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-ops-db
          property: connectionString
      - key: SETUP_TOKEN
        generateValue: true
      - key: SQUARE_ACCESS_TOKEN
        sync: false
      - key: MARGINEDGE_API_KEY
        sync: false
      # Online orders. Leave SQUARE_ENVIRONMENT as sandbox until a test order has gone through end to end.
      - key: SQUARE_CHECKOUT_TOKEN
        sync: false
      - key: SQUARE_APPLICATION_ID
        sync: false
      - key: SQUARE_CHECKOUT_LOCATION_ID
        sync: false
      - key: SQUARE_ENVIRONMENT
        value: sandbox
      # Order confirmation emails (Resend). Unset = none sent.
      - key: RESEND_API_KEY
        sync: false
      - key: ORDER_EMAIL_FROM
        sync: false
      - key: ORDER_EMAIL_REPLY_TO
        sync: false

databases:
  - name: restaurant-ops-db
    plan: 0.1c-256mb
    databaseName: restaurant_ops
